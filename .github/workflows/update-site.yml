name: Refresh content and publish Pages

on:
  schedule:
    # Avoid the busy start of the hour. Cron is UTC and runs on the default branch.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: model-watch-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install collection dependency
        run: python -m pip install -r requirements.txt
      - name: Check parsers and failure handling
        run: |
          python -m unittest discover -s tests -v
          node tests/test_client.cjs
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Collect public news and reset archive
        id: refresh
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/refresh_content.py --previous-url "${PAGES_BASE_URL%/}/content.json" --github-output "$GITHUB_OUTPUT"
      - name: Preserve changed public records in the repository
        if: steps.refresh.outputs.content_changed == 'true'
        continue-on-error: true
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/data.js
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public AI news and reset archive'
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
      - name: Build static files
        run: |
          python scripts/build.py
          node --check assets/js/app.js
          node --check assets/js/health.js
          mkdir -p _site
          cp index.html content.json _site/
          touch _site/.nojekyll
      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
